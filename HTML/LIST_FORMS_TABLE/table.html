<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in Html</title>
</head>

<body>
    <table>
        <!-- Every table have two tags head and body --> 
    <!-- table head starts from here  -->
    <thead>
        <tr>
            <!-- tr stands for table row and then th means = table head fill in table head (row) -->
            <th>name</th>
            <th>class</th>
            <th>subject</th>
            <th>new one </th>
        </tr>

    </thead>
    <!-- table body starts from here -->
    <tbody>
        <!-- simillar like head fill tr and td  -->
        <tr>
            <td>satyam</td>
            <td>btech</td>
            <td>html</td>
            <td>new value</td>
        </tr>
        <tr>
            <td>satyam</td>
            <td>btech</td>
            <td>html3</td>
        </tr>
        <tr>
            <td>satyam</td>
            <td>btech</td>
            <td>html5</td>
        </tr>

        <tr>
            <!-- colspan merge 2 cells  by default 1 -->
            <td colspan="2">satyam write by merging two cells</td>
            <td> bhai </td>
            <td>new one added</td>
        </tr>
    </tbody>
    </table>
</body>

</html>
