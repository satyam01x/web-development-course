<!DOCTYPE html>
<html>

<head>

    <title>Digital Clock</title>

    <style>

        body{
            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;

            background:black;
            color:white;

            font-size:50px;
            font-family:Arial;
        }

        #clock{
            border:3px solid white;
            padding:20px 40px;
            border-radius:10px;
        }

    </style>

</head>

<body>

    <div id="clock"></div>

    <script>

        function updateClock(){

            let now = new Date();

            let hours = now.getHours();

            let minutes = now.getMinutes();

            let seconds = now.getSeconds();

            // Add leading zero

            if(hours < 10){
                hours = "0" + hours;
            }

            if(minutes < 10){
                minutes = "0" + minutes;
            }

            if(seconds < 10){
                seconds = "0" + seconds;
            }

            let time = hours + ":" + minutes + ":" + seconds;

            document.getElementById("clock").innerHTML = time;

        }

        // Update every second

        setInterval(updateClock, 1000);

        // Initial call

        updateClock();

    </script>

</body>

</html>
