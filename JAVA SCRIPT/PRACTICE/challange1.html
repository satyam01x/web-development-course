<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT video</title>
    <style>

        }

        .time{

            bottom: 8px;
            right: 8px;

            font-size: 12px;
            border-radius: 4px;
        }
        .title{
            padding: 10px;
            /* background-color:black;
            color: white; */
        }

        .title h1 {
            color: white;
            margin: 0;
            font-size: 16px;
        }

        .title p {
            margin-top: 5px;
            color: rgb(237, 228, 228);
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo"><img src="prime.avif" alt="thumbnail">
            <span class ="time">14:15</span>
        </div>
        <div class="title">

</html>
