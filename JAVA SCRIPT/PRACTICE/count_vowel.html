<script>
    function vowels(a){
        let count = 0;
        let my_vowel = "aeiouAEIOU"
        for (let i = 0; i<a.length ; i++){
            if(my_vowel.includes(a[i])){
                count += 1;
            }
            
        }
        return count;
    }
    console.log((vowels("satyam aeb")));
</script>
