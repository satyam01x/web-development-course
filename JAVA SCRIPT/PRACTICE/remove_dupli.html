<script>function removeduplicate(arr) {
        let afterremove = [];

        for (let i = 0; i < arr.length; i++) {
            if (!afterremove.includes(arr[i])) {
                afterremove.push(arr[i]);
            }
        }

        return afterremove;
    }

    console.log(removeduplicate([1, 11,1, 2,22, 5, 3]));
</script>
