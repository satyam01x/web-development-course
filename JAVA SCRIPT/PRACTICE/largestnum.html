<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>largest num</title>
</head>
<body>
    <div class="largest">largest num</div>


    <script>
        function largest (a,b,x){
            if (a>b && a>x){
                console.log("a is largest")
            }
            else if
                (b>a && b>x){
                    console.log("b is largest")
                }
                else{
                    console.log("x is largest")
                }
            }
        
            largest(2,34,6)
    </script>
</body>
</html>
