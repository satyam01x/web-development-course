<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hacking</title>

</head>
<style>
    body {
        margin: 25px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-size: xx-large;
        gap: 25px;
    }
</style>

<body>
    <div id="container">

    </div>

</body>
<script>
    /*<!-- Create a hacking simulator which has green background and it shows these messages with random delay of 1 to 7 seconds 
     
     Initializing Hacking...
     Reading your Files...
     Password files Detected...
     Sending all passwords and personal files to server...
     Cleaning up...
 
     The three dots must blink so that it looks like a real terminal
     */
    let p = document.getElementById("container");
    let messages = [
        "Initializing Hacking...",
        "Reading your Files...",
        "Password files Detected...",
        "Sending all passwords and personal files to server...",
        "Cleaning up...",
        "done"
    ];

    function getrandomdelay() {
        return Math.floor(Math.random() * 7000) + 1000;
    }

    function delay(ms) {
        return new Promise(function (resolve) {
            setTimeout(resolve, ms);
        })
    }

    async function hacking() {

        for (let element of messages) {
            let div = document.createElement("div");
            div.innerText = element;
            p.appendChild(div);

            await delay(getrandomdelay());
        };

    }
    document.body.style.backgroundColor = "green";

    hacking();
</script>

</html>
