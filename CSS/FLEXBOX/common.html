<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox All Properties Demo</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>

<h1>FLEXBOX – ALL PROPERTIES DEMO</h1>

<h2>JUSTIFY-CONTENT</h2>

<div class="container jc-start">
  <div class="box">1</div><div class="box">2</div><div class="box">3</div>
</div>

<div class="container jc-center">
  <div class="box">1</div><div class="box">2</div><div class="box">3</div>
</div>

<div class="container jc-end">
  <div class="box">1</div><div class="box">2</div><div class="box">3</div>
</div>

<div class="container jc-between">
  <div class="box">1</div><div class="box">2</div><div class="box">3</div>
</div>

<div class="container jc-around">
  <div class="box">1</div><div class="box">2</div><div class="box">3</div>
</div>

<div class="container jc-evenly">
  <div class="box">1</div><div class="box">2</div><div class="box">3</div>
</div>

<hr>

<h2>ALIGN-ITEMS</h2>

<div class="container ai-start">
  <div class="box tall">A</div><div class="box">B</div><div class="box">C</div>
</div>

<div class="container ai-center">
  <div class="box tall">A</div><div class="box">B</div><div class="box">C</div>
</div>

<div class="container ai-end">
  <div class="box tall">A</div><div class="box">B</div><div class="box">C</div>
</div>

<hr>

<h2>FLEX-WRAP + ALIGN-CONTENT</h2>

<div class="container wrap ac-start">
  <div class="box">1</div><div class="box">2</div><div class="box">3</div>
  <div class="box">4</div><div class="box">5</div><div class="box">6</div>
</div>

<div class="container wrap ac-center">
  <div class="box">1</div><div class="box">2</div><div class="box">3</div>
  <div class="box">4</div><div class="box">5</div><div class="box">6</div>
</div>

<div class="container wrap ac-between">
  <div class="box">1</div><div class="box">2</div><div class="box">3</div>
  <div class="box">4</div><div class="box">5</div><div class="box">6</div>
</div>

</body>
</html>
