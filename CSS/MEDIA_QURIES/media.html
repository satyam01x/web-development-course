<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media Query Clear Demo</title>
  <link rel="stylesheet" href="media.css">
</head>
<body>

<h1>MEDIA QUERY – MIN & MAX WIDTH DEMO</h1>

<!-- MAX WIDTH -->
<div class="box max-480">MAX-WIDTH: 480px (Mobile)</div>
<div class="box max-768">MAX-WIDTH: 768px (Tablet)</div>

<!-- MIN WIDTH -->
<div class="box min-480">MIN-WIDTH: 480px</div>
<div class="box min-768">MIN-WIDTH: 768px</div>

<!-- RANGE -->
<div class="box range">WIDTH: 500px – 900px</div>

<p class="note">
  Screen resize karo → box ka color aur text change hoga
</p>

</body>
</html>
